<!doctype html><html><body><button id="run">Run PR UI checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadPullRequests}from'/src/LaunchpadPullRequests.tsx';import{api}from'/src/api.ts';
let pending,calls=[];api.readGithubPullRequests=(owner,repo,page)=>{calls.push({owner,repo,page});return new Promise((resolve,reject)=>pending={resolve,reject})};const root=createRoot(document.getElementById('root'));root.render(React.createElement(LaunchpadPullRequests));const tick=()=>new Promise(r=>setTimeout(r,50)),button=text=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===text),field=()=>document.querySelector('[aria-label="GitHub repository"]'),set=value=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(field(),value);field().dispatchEvent(new Event('input',{bubbles:true}))};
const response=(page,items,nextPage)=>({provider:'github',host:'github.com',repository:'o/r',page,items,nextPage}),item={id:'12345678901234567890',number:7,title:'<script>literal title<\/script>',author:'author',draft:null,headBranch:'feature',baseBranch:'main',requestedReviewers:['reviewer'],labels:['bug'],milestone:{number:'9007199254740993',title:'Release'},url:'https://github.com/o/r/pull/7'};
document.getElementById('run').onclick=async()=>{const checks=[],assert=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{await tick();assert(button('Load pull requests').disabled&&document.getElementById(field().getAttribute('aria-describedby')).textContent.includes('owner/repository'),'empty repository explains disabled actions');set('bad/path/extra');await tick();button('Load pull requests').click();await tick();assert(!calls.length&&!!document.querySelector('[role="alert"]'),'invalid scope refuses network');set('o/r');await tick();button('Load pull requests').click();await tick();assert(field().disabled&&button('Load pull requests').disabled,'busy inputs disabled');assert(JSON.stringify(calls[0])===JSON.stringify({owner:'o',repo:'r',page:1}),'exact scope and first page');pending.resolve(response(1,[item],2));await tick();assert(document.querySelector('#root').textContent.includes(item.title)&&!document.querySelector('#root script'),'untrusted title rendered literally');assert(document.querySelector('#root').textContent.includes('Draft status unknown'),'unknown draft is visible');button('Load more pull requests').click();await tick();pending.reject('PROVIDER_ACCESS_OR_RATE_LIMIT');await tick();assert(document.querySelector('[role="alert"]').textContent.includes('RATE_LIMIT')&&document.querySelector('#root').textContent.includes(item.title),'page error preserves rows');button('Load more pull requests').click();await tick();assert(calls[2].page===2,'retry requests same page');pending.resolve(response(2,[item,{...item,id:'2',number:8,title:'Second PR',labels:['Bug'],milestone:{number:'9007199254740994',title:'Release'}}],null));await tick();assert(document.querySelectorAll('.provider-table tbody tr').length===2&&!button('Load more pull requests'),'duplicate ID deduped and final page ends pagination');const search=document.querySelector('[aria-label="Filter loaded pull requests"]'),draft=document.querySelector('[aria-label="Filter pull request draft status"]');
const searchFor=value=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(search,value);search.dispatchEvent(new Event('input',{bubbles:true}))};
searchFor('Second');await tick();assert(document.querySelectorAll('.provider-table tbody tr').length===1&&document.querySelector('#root').textContent.includes('1 of 2 loaded'),'search filters loaded titles with counts');
draft.value='draft';draft.dispatchEvent(new Event('change',{bubbles:true}));await tick();assert(document.querySelector('#root').textContent.includes('No matching loaded pull requests.'),'draft filter distinguishes unknown from drafts');
draft.value='unknown';draft.dispatchEvent(new Event('change',{bubbles:true}));await tick();assert(document.querySelectorAll('.provider-table tbody tr').length===1,'unknown draft filter restores matching row');
searchFor('no such reviewer');await tick();assert(!document.querySelectorAll('.provider-table tbody tr').length&&document.querySelector('#root').textContent.includes('No matching loaded pull requests.'),'no-match view discloses loaded scope');
searchFor('');draft.value='all';draft.dispatchEvent(new Event('change',{bubbles:true}));await tick();assert(document.querySelectorAll('.provider-table tbody tr').length===2,'cleared filters restore cached rows without network');
const choose=async(name,value)=>{const control=document.querySelector(`[aria-label="${name}"]`);control.value=value;control.dispatchEvent(new Event('change',{bubbles:true}));await tick()},rows=()=>[...document.querySelectorAll('.provider-table tbody tr')],labelName='Filter pull request label',milestoneName='Filter pull request milestone';
assert(document.querySelector(`[aria-label="${labelName}"]`).options.length===3,'next page contributes label options');
assert(document.querySelector(`[aria-label="${milestoneName}"]`).options.length===3,'same milestone title retains distinct lossless IDs');
await choose(labelName,JSON.stringify('bug'));assert(rows().length===1&&rows()[0].textContent.includes(item.title),'label matching is case sensitive');
await choose(milestoneName,'9007199254740994');assert(rows().length===0,'label and milestone intersect');
await choose(labelName,JSON.stringify('Bug'));assert(rows().length===1&&rows()[0].textContent.includes('Second PR'),'milestone number selects exact row');
searchFor('Release');await tick();assert(rows().length===1,'milestone title participates in text search');searchFor('');await tick();
button('Load pull requests').click();await tick();pending.resolve(response(1,[item],2));await tick();assert(rows().length===0&&document.querySelector(`[aria-label="${labelName}"]`).selectedOptions[0].textContent.includes('not in loaded results'),'same repository refresh preserves absent filter');
button('Load more pull requests').click();await tick();pending.resolve(response(2,[{...item,id:'2',number:8,title:'Second PR',labels:['Bug'],milestone:{number:'9007199254740994',title:'Release'}}],null));await tick();assert(rows().length===1&&rows()[0].textContent.includes('Second PR'),'pagination restores selected label and milestone without resetting');
set('o/other');await tick();button('Load pull requests').click();await tick();pending.resolve({...response(1,[{...item,labels:null,milestone:null}],null),repository:'o/other'});await tick();assert(rows().length===1&&document.querySelector(`[aria-label="${labelName}"]`).value===''&&document.querySelector(`[aria-label="${milestoneName}"]`).value==='','repository change clears repository scoped filters and includes unknown metadata');
set('o/r');await tick();button('Load pull requests').click();await tick();pending.resolve(response(1,[],null));await tick();assert(document.querySelector('#root').textContent.includes('No open pull requests.'),'successful empty state distinct');document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
