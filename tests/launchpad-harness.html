<!doctype html><html><body><button id="run">Run Launchpad checks</button><pre id="result">Not run</pre><div id="root"></div><iframe id="peer" src="about:blank"></iframe><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{Launchpad}from'/src/Launchpad.tsx';
const KEY='branchdesk.repository-pins.v1',root=createRoot(document.getElementById('root')),tick=()=>new Promise(r=>setTimeout(r,50));let busy=false,calls=[];
const render=()=>root.render(React.createElement(Launchpad,{tabs:[{repoId:'a',name:'Alpha'},{repoId:'b',name:'Beta'}],recent:['/tmp/alpha','/tmp/beta'],busy,warning:'',onClose:()=>calls.push('close'),onSelect:id=>calls.push(id),onRecent:path=>calls.push(path),onForget:path=>calls.push('forget:'+path),onStart:mode=>calls.push(mode)}));
const button=text=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===text);const label=text=>document.querySelector(`[aria-label="${text}"]`);
document.getElementById('run').onclick=async()=>{const checks=[],original=localStorage.getItem(KEY);const assert=(ok,label)=>{if(!ok)throw Error(label);checks.push(label)};try{
localStorage.removeItem(KEY);render();await tick();button('Alpha').click();assert(calls.pop()==='a','open tab exact session ID');
for(const [text,mode] of [['Open repository','open'],['Clone repository','clone'],['Create repository','create']]){button(text).click();assert(calls.pop()===mode,text+' correct flow');}
button('/tmp/alpha').click();assert(calls.pop()==='/tmp/alpha','recent exact path');label('Pin repository: /tmp/alpha').click();await tick();assert(JSON.parse(localStorage.getItem(KEY))[0]==='/tmp/alpha','pin persists');assert([...document.querySelectorAll('#root button')].filter(b=>b.textContent==='/tmp/alpha').length===1,'pinned entry not duplicated');
busy=true;render();await tick();label('Unpin repository: /tmp/alpha').click();assert(JSON.parse(localStorage.getItem(KEY)).length===1,'busy pin disabled');busy=false;render();await tick();
document.getElementById('peer').contentWindow.localStorage.setItem(KEY,JSON.stringify(['/tmp/alpha','/tmp/peer']));await tick();assert(!!label('Unpin repository: /tmp/peer'),'other window update visible');
label('Pin repository: /tmp/beta').click();await tick();assert(JSON.parse(localStorage.getItem(KEY)).includes('/tmp/peer'),'local pin preserves external pin');label('Remove from recent: /tmp/alpha').click();await tick();assert(calls.pop()==='forget:/tmp/alpha'&&!JSON.parse(localStorage.getItem(KEY)).includes('/tmp/alpha'),'remove list-only callback and pin');button('Sort: recent').click();await tick();assert(button('Sort: path').getAttribute('aria-pressed')==='true','sort toggles');const peer=document.getElementById('peer').contentWindow;
peer.localStorage.removeItem(KEY);await tick();assert(!label('Unpin repository: /tmp/beta')&&!!label('Pin repository: /tmp/beta'),'external removal clears pins');
peer.localStorage.setItem(KEY,'not-json');await tick();assert(!!label('Pin repository: /tmp/beta'),'malformed external list remains usable');
const setItem=Storage.prototype.setItem;try{Storage.prototype.setItem=function(key,value){if(key===KEY)throw Error('simulated quota');return setItem.call(this,key,value)};label('Pin repository: /tmp/beta').click();await tick();assert(!!label('Unpin repository: /tmp/beta')&&document.querySelector('#root [role="status"]').textContent.includes('could not be saved'),'failed persistence retains session pin with visible warning');}finally{Storage.prototype.setItem=setItem;}
label('Close Launchpad').click();assert(calls.pop()==='close','close callback');document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}finally{root.render(null);if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}};
</script></body></html>
