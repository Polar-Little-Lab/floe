<!doctype html><html><body><button id="run-checks">Run safety checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {RebaseDialog} from '/src/RebaseDialog.tsx';
import {RebaseResolutionDialog} from '/src/RebaseResolutionDialog.tsx';
const root=createRoot(document.getElementById('root'));
window.events=[];let epoch=0;
window.preview=()=>root.render(React.createElement(RebaseDialog,{key:++epoch,plan:{branch:'topic',upstream:'main',upstreamOid:'a'.repeat(40),kind:'replay',selections:[],skippedEquivalent:[],flattenedMerges:[],replay:null,blockers:['CONFLICTS']},busy:false,error:'',defaultIdentity:{name:'Test',email:'t@invalid'},onClose:()=>window.events.push('close'),onApply:()=>window.events.push('apply'),onStart:()=>window.events.push('start')}));
window.draft=(pending=true,busy=false,completed=false)=>root.render(React.createElement(RebaseResolutionDialog,{key:++epoch,view:{id:'draft',branch:'topic',upstream:'main',revision:'r',resultOid:'a'.repeat(40),completed,skipped:[],pending:pending?{source:'b'.repeat(40),ordinal:0,conflicts:[{id:'f',path:'a',ancestor:'base',ours:'upstream',theirs:'incoming',binary:false,present:[true,true,true]}],resolutions:{}}:null},busy,error:'',onClose:()=>window.events.push('close'),onResolve:(id,r)=>window.events.push({id,...r}),onSkip:()=>window.events.push('skip'),onContinue:()=>window.events.push('continue'),onAbort:()=>window.events.push('abort')}));


const tick=()=>new Promise(r=>setTimeout(r,50));
const button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t);
const check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};let checks=[];
document.getElementById('run-checks').onclick=async()=>{try{checks=[];window.events=[];

window.preview();await tick();button('Resolve rebase conflicts').click();check(events.at(-1)==='start'&&!events.includes('apply'),'Conflicted preview starts resolution rather than apply');
window.draft(true);await tick();check(button('Continue rebase').disabled,'Unresolved conflicts disable Continue');const count=events.length;button('Continue rebase').click();check(events.length===count,'Disabled Continue sends no callback');check(document.getElementById('root').textContent.includes('Current is the upstream'),'Conflict side semantics visible');button('Skip current commit').click();check(events.at(-1)==='skip','Explicit skip callback');button('Abort rebase').click();check(events.at(-1)==='abort','Explicit abort callback');
window.draft(true,true);await tick();check([...document.querySelectorAll('#root button,#root input,#root textarea,#root select')].every(b=>b.disabled),'Busy resolution guards all actions and fields');
window.draft(false);await tick();check(!button('Continue rebase').disabled&&!button('Skip current commit'),'Resolved draft allows Continue and removes Skip');button('Continue rebase').click();check(events.at(-1)==='continue','Resolved continue callback');
window.draft(false,false,true);await tick();check(!button('Abort rebase')&&!button('Skip current commit')&&!!button('Finish rebase'),'Completed draft only finishes without abort/skip');check(document.getElementById('root').textContent.includes('without changing files again'),'Completed explanation prohibits duplicate application');button('Finish rebase').click();check(events.at(-1)==='continue','Finish callback');

document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks,scope:'Actual components; controlled props/callbacks only; not native IPC or Git effects'},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
