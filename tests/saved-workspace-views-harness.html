<!doctype html><html><body><button id="run">Run saved view checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
const siblingView={id:'sibling',name:'Other',kind:'all',query:'',filters:{author:null,label:null,milestone:null}};let record={workspace:{selected:'a',groups:[{id:'a',name:'Alpha',repositories:[{owner:'o',repo:'a',localPath:null}],views:[]},{id:'b',name:'Beta',repositories:[],views:[siblingView]}]},revision:'1',warning:null},writes=0,reads=0;
api.loadNamedWorkspaces=async()=>structuredClone(record);api.saveNamedWorkspaces=async(revision,workspace)=>{if(revision!==record.revision)throw Error('STALE_WORKSPACE: Reload settings before saving.');writes++;record={workspace:structuredClone(workspace),revision:String(Number(record.revision)+1),warning:null};return structuredClone(record)};
api.readGithubPullRequests=async(o,r,p)=>{reads++;return {provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[]}};api.readGithubIssues=async(o,r,p)=>{reads++;return {provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[{id:'1',number:1,title:'bug issue',author:'Alice',assignees:[],labels:['bug'],milestone:{number:'1',title:'Release'},url:'https://github.com/o/a/issues/1'}]}};
const root=createRoot(document.getElementById('root'));root.render(React.createElement(LaunchpadTasks));const tick=()=>new Promise(r=>setTimeout(r,60)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),label=name=>document.querySelector(`[aria-label="${name}"]`),input=(name,value)=>{const f=label(name);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(f,value);f.dispatchEvent(new Event('input',{bubbles:true}))},select=async(name,value)=>{const f=label(name);f.value=value;f.dispatchEvent(new Event('change',{bubbles:true}));await tick()},views=()=>record.workspace.groups[0].views;
document.getElementById('run').onclick=async()=>{const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();button('Load workspace tasks').click();await tick();button('Issues').click();await tick();input('Search workspace tasks','bug');await select('Filter workspace label',JSON.stringify('bug'));await select('Filter workspace milestone',JSON.stringify(JSON.stringify(['o/a','1'])));input('Saved view name','Release bugs');await tick();button('Save current view as new').click();await tick();check(views().length===1&&views()[0].kind==='issues'&&views()[0].query==='bug'&&views()[0].filters.milestone===JSON.stringify(['o/a','1']),'create captures task type query and repo-scoped filters');const id=views()[0].id;check(record.workspace.groups[1].views[0].id==='sibling','saving view preserves other workspace views');
button('All').click();input('Search workspace tasks','other');await select('Filter workspace label','');await select('Filter workspace milestone','');const beforeReads=reads;button('Apply saved view').click();await tick();check(button('Issues').getAttribute('aria-pressed')==='true'&&label('Search workspace tasks').value==='bug'&&label('Filter workspace label').value===JSON.stringify('bug'),'apply restores kind search and structured filters');check(reads===beforeReads,'apply never starts provider requests');check(document.querySelectorAll('[aria-label="Workspace task results"] .recent-repository').length===1,'applied view filters actual cached rows');
input('Saved view name','Updated');input('Search workspace tasks','next');await tick();button('Update saved view').click();await tick();check(views().length===1&&views()[0].id===id&&views()[0].name==='Updated'&&views()[0].query==='next','update retains view identity');
record.revision='100';input('Saved view name','Conflict draft');input('Search workspace tasks','keep query');await tick();button('Update saved view').click();await tick();check(label('Saved view name').value==='Conflict draft'&&label('Search workspace tasks').value==='keep query'&&document.querySelector('[aria-label="Saved workspace views"]').textContent.includes('STALE'),'save conflict preserves name and query');check(views()[0].name==='Updated','conflict does not overwrite persisted view');button('Reload saved views').click();await tick();check(label('Saved view name').value==='Conflict draft'&&label('Search workspace tasks').value==='keep query','reload preserves current unsaved conditions');button('Update saved view').click();await tick();check(views()[0].name==='Conflict draft','explicit retry uses reloaded revision');
button('Edit workspace').click();await tick();input('Workspace name','Renamed Alpha');await tick();button('Save workspace changes').click();await tick();check(record.workspace.groups[0].name==='Renamed Alpha'&&views()[0].id===id,'manager uses revision updated by saved-view save without dropping views');
root.render(null);await tick();root.render(React.createElement(LaunchpadTasks));await tick();check(label('Saved workspace view').options.length===2&&label('Search workspace tasks').value==='','remount restores saved views without auto-applying');await select('Saved workspace view',id);check(label('Search workspace tasks').value==='','select does not implicitly apply');button('Apply saved view').click();await tick();check(label('Search workspace tasks').value==='keep query'&&button('Issues').getAttribute('aria-pressed')==='true','restored saved view applies after remount');
const beforeWrites=writes;button('Remove saved view').click();await tick();check(writes===beforeWrites&&label('Confirm saved view removal').textContent.includes('Conflict draft'),'removal asks about named saved view before mutation');button('Cancel saved view removal').click();await tick();check(views().length===1,'cancel retains saved view');button('Remove saved view').click();await tick();button('Confirm saved view removal').click();await tick();check(views().length===0&&label('Search workspace tasks').value==='keep query','remove deletes saved definition without resetting current conditions');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
