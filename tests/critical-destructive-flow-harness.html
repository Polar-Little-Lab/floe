<!doctype html><html><body><button id="run-checks">Run critical workflow checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{demo}from'/src/demo.ts';import{api}from'/src/api.ts';import App from'/src/App.tsx';
const fixture=structuredClone(demo),oid=fixture.commits[0].oid;
Object.assign(demo,{repoId:'tag-fixture',revision:'reviewed',headOid:oid,writeBlock:null,recoveryPending:false,changes:fixture.changes,repositoryIdentity:{name:'Fixture',email:'fixture@example.invalid'}});
let current=structuredClone(demo),pending,calls=[];
api.refresh=async()=>structuredClone(current);api.commit=async()=>({oid,parentOid:null,message:'Fixture commit',files:[]});
api.loadDraft=async()=>({draft:null,revision:'missing',warning:null});api.saveDraft=async(id,revision,draft)=>({draft,revision:'saved',warning:null});api.saveWorkspace=async()=>({workspace:null,revision:'saved',warning:null});
api.mutate=(snapshot,action)=>{calls.push({snapshot:structuredClone(snapshot),action:structuredClone(action)});return new Promise((resolve,reject)=>{pending={resolve,reject}})};
createRoot(document.getElementById('root')).render(React.createElement(App));
const tick=()=>new Promise(r=>setTimeout(r,60));
const button=(text,parent=document)=>[...parent.querySelectorAll('button')].find(b=>b.textContent===text);
const set=(el,value)=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(el,value);el.dispatchEvent(new Event('input',{bubbles:true}));};
const dialog=label=>document.querySelector(`[role=dialog][aria-label="${label}"]`);
const openDiscard=async()=>{button('Actions').click();await tick();button('Discard changes with backup…').click();await tick()};
document.getElementById('run-checks').onclick=async()=>{const checks=[];const check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();await openDiscard();let d=()=>dialog('Discard all changes');check(!!d(),'Discard opens backup review');check(d().textContent.includes('Discard backup')&&d().textContent.includes('Ignored files are left unchanged'),'Recovery and ignored-file semantics visible');button('Keep changes',d()).click();await tick();check(!d()&&calls.length===0,'Keep changes sends no mutation');
await openDiscard();button('Back up and discard',d()).click();await tick();check(calls.length===1&&calls[0].action.kind==='saveStash'&&calls[0].action.include_untracked&&calls[0].action.message.startsWith('Discard backup'),'Discard requests recoverable stash including untracked');check([...d().querySelectorAll('button')].every(b=>b.disabled),'Discard pending guards');button('Saving backup…',d()).click();await tick();check(calls.length===1,'Duplicate discard suppressed');pending.reject('CANCELLED: native cancelled');await tick();check(!!d()&&!d().querySelector('[role=alert]'),'Native cancellation retains review without error');
button('Back up and discard',d()).click();await tick();current={...current,revision:'external-discard',changes:[...current.changes,{...current.changes[0],id:'new-external',path:'new-external.txt'}]};pending.reject('STALE_STATE: external change');await tick();check(d().querySelector('[role=alert]').textContent.includes('STALE_STATE'),'Stale discard displays failure');check(!d().textContent.includes('new-external.txt'),'Failed review stays frozen');button('Keep changes',d()).click();await tick();await openDiscard();check(d().textContent.includes('new-external.txt'),'Reopening reviews new file');button('Back up and discard',d()).click();await tick();check(calls.at(-1).snapshot.revision==='external-discard','Re-reviewed discard uses current revision');current={...current,revision:'discarded',changes:[]};pending.resolve(structuredClone(current));await tick();check(!d(),'Discard success closes');
const parent=fixture.commits[0].parents[0];button('Undo').click();await tick();d=()=>dialog('Move branch and keep changes');check(d().textContent.includes(parent),'Undo names exact parent');const count=calls.length;button('Cancel',d()).click();await tick();check(!d()&&calls.length===count,'Undo Cancel sends no mutation');button('Undo').click();await tick();button('Move branch and keep changes',d()).click();await tick();check(calls.at(-1).action.kind==='softReset'&&calls.at(-1).action.oid===parent,'Undo sends exact target');check([...d().querySelectorAll('button')].every(b=>b.disabled),'Reset pending guards');pending.reject('CANCELLED: native cancelled');await tick();check(!!d()&&!d().querySelector('[role=alert]'),'Native reset cancellation retains review');button('Move branch and keep changes',d()).click();await tick();current={...current,revision:'undo-complete',headOid:parent};pending.resolve(structuredClone(current));await tick();check(!d()&&!button('Redo').disabled,'Undo enables session redo');button('Redo').click();await tick();check(d().textContent.includes(oid),'Redo names original tip');button('Move branch and keep changes',d()).click();await tick();check(calls.at(-1).snapshot.revision==='undo-complete'&&calls.at(-1).action.oid===oid,'Redo uses current revision and original tip');current={...current,revision:'redo-complete',headOid:oid};pending.resolve(structuredClone(current));await tick();check(!d()&&button('Redo').disabled,'Redo clears one-shot state');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks,scope:'Actual React App, controlled API; no native IPC/Git assertions'},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
