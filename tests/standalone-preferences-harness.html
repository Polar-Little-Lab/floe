<!doctype html><html><body><button id="run">Run snooze checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
let clock=1800000000000;Date.now=()=>clock;let record={workspace:null,revision:'1',warning:null},reads=0,writes=0;
api.loadNamedWorkspaces=async()=>structuredClone(record);api.saveNamedWorkspaces=async(revision,workspace)=>{if(revision!==record.revision)throw Error('STALE_WORKSPACE');writes++;record={workspace:structuredClone(workspace),revision:String(+record.revision+1),warning:null};return structuredClone(record)};
api.readGithubPullRequests=async(o,r,p)=>{reads++;return{provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[{id:'1',number:1,title:'Pull title',author:'alice',headBranch:'topic',baseBranch:'main',draft:false,requestedReviewers:[],labels:[],milestone:null,url:'https://github.com/o/r/pull/1'}]}};api.readGithubIssues=async(o,r,p)=>{reads++;return{provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[{id:'1',number:2,title:'Issue title',author:'bob',assignees:[],labels:[],milestone:null,url:'https://github.com/o/r/issues/2'}]}};
const root=createRoot(document.getElementById('root'));root.render(React.createElement(LaunchpadTasks));const tick=()=>new Promise(r=>setTimeout(r,70)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),label=n=>document.querySelector(`[aria-label="${n}"]`),input=async(n,v)=>{const e=label(n);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));await tick()},rows=n=>label(n).querySelectorAll('.recent-repository').length;
document.getElementById('run').onclick=async()=>{const checks=[],check=(ok,n)=>{if(!ok)throw Error(n);checks.push(n)};try{await tick();await input('GitHub repository','o/r');button('Load pull requests').click();await tick();await input('GitHub issue repository','o/r');button('Load issues').click();await tick();check(rows('GitHub pull requests')===1&&rows('GitHub issues')===1,'standalone PR and issue load without workspace');button('Pin task').click();await tick();check(record.workspace.groups.length===0&&record.workspace.pins[0].kind==='pulls','first pin initializes empty workspace settings');button('Snooze 1 hour').click();await tick();check(rows('GitHub pull requests')===0&&rows('GitHub issues')===1,'standalone snooze isolates same-ID issue');button('Snoozed').click();await tick();check(label('Saved task preferences').textContent.includes('o/r')&&label('Saved task preferences').textContent.includes('pulls'),'global Snoozed exposes standalone task');button('Unsnooze saved task').click();await tick();button('All').click();await tick();check(rows('GitHub pull requests')===1&&label('GitHub pull requests').textContent.includes('Unpin task'),'unsnooze restores cached standalone pinned row');
await input('Workspace name','Shared');const repos=label('Workspace repositories');Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(repos,'o/r');repos.dispatchEvent(new Event('input',{bubbles:true}));await tick();button('Create workspace').click();await tick();button('Load workspace tasks').click();await tick();check(label('o/r pulls').textContent.includes('Unpin task'),'workspace feed uses standalone pin');[...label('o/r pulls').querySelectorAll('button')].find(b=>b.textContent==='Snooze 1 hour').click();await tick();const selection=label('Selected workspace');selection.value='';selection.dispatchEvent(new Event('change',{bubbles:true}));await tick();check(rows('GitHub pull requests')===0&&record.workspace.pins.length===1,'workspace snooze hides cached standalone task without losing pin');button('Snoozed').click();await tick();button('Unsnooze saved task').click();await tick();button('All').click();await tick();check(rows('GitHub pull requests')===1,'global unsnooze returns shared standalone row');
record.revision='100';button('Unpin task').click();await tick();check(record.workspace.pins.length===1&&label('GitHub pull requests').textContent.includes('STALE_WORKSPACE'),'failed standalone unpin retains saved pin');button('Reload workspaces').click();await tick();button('Unpin task').click();await tick();check(record.workspace.pins.length===0,'reload allows standalone unpin retry');
button('Snooze 1 hour').click();await tick();root.render(null);await tick();root.render(React.createElement(LaunchpadTasks));await tick();const before=reads;button('Snoozed').click();await tick();check(label('Saved task preferences').textContent.includes('ID 1')&&reads===before,'restart exposes standalone snooze without provider fetch');button('Unsnooze saved task').click();await tick();check(record.workspace.snoozes.length===0,'restart saved entry can be unsnoozed');

const identity=(repository,kind,id)=>({provider:'github',host:'github.com',account:'anonymous',repository,kind,id});record.workspace.pins=[identity('o/pr-only','pulls','10'),identity('o/issue-only','issues','11'),identity('o/sleeping','pulls','12')];record.workspace.snoozes=[{task:record.workspace.pins[2],until:clock+3600000}];record.revision=String(+record.revision+1);button('Reload workspaces').click();await tick();button('Pull requests').click();await tick();check(label('Saved task preferences').textContent.includes('pr-only')&&!label('Saved task preferences').textContent.includes('issue-only')&&!label('Saved task preferences').textContent.includes('sleeping'),'PR view restricts saved pins and hides snoozed pins');button('Issues').click();await tick();check(label('Saved task preferences').textContent.includes('issue-only')&&!label('Saved task preferences').textContent.includes('pr-only'),'issue view restricts saved pins');button('WIPs').click();await tick();check(!label('Saved task preferences'),'WIP view excludes remote saved-task inventory');button('Snoozed').click();await tick();check(label('Saved task preferences').textContent.includes('sleeping'),'Snoozed retains hidden pinned task');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
