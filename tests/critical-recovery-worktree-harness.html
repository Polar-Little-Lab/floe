<!doctype html><html><body><button id="run">Run recovery/worktree checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{RecoveryCheckpointsDialog}from'/src/RecoveryCheckpointsDialog.tsx';import{WorktreesDialog}from'/src/WorktreesDialog.tsx';
const root=createRoot(document.getElementById('root')),tick=()=>new Promise(r=>setTimeout(r,60));let events=[],checks=[];
const check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};const button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t);const field=t=>document.querySelector(`[aria-label="${t}"]`);
const input=(label,value)=>{const e=field(label);Object.getOwnPropertyDescriptor(e.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(e,value);e.dispatchEvent(new Event(e.tagName==='SELECT'?'change':'input',{bubbles:true}))};
const entry={reference:'refs/branchdesk/checkpoints/fixture',oid:'a'.repeat(40),summary:'Saved work',author:'Fixture',time:100};
const recovery={listing:{entries:[entry],truncated:false},busy:false,writable:true,error:'',onClose:()=>events.push(['close']),onCreate:(e,n)=>events.push(['recover',e.reference,e.oid,n])};
const wt={name:'linked',path:'/synthetic/linked',branch:'used',valid:true,locked:false};
const worktree={listing:{entries:[wt,{name:'missing',path:'/synthetic/missing',branch:'lost',valid:false,locked:true}],truncated:false},branches:[{name:'main',oid:'a'.repeat(40),current:true},{name:'used',oid:'b'.repeat(40),current:false},{name:'free',oid:'c'.repeat(40),current:false}],busy:false,canCreate:true,error:'',checkouts:{},onClose:()=>events.push(['close']),onReload:()=>events.push(['reload']),onCreate:(...args)=>events.push(['create',...args]),onInspect:n=>events.push(['inspect',n]),onCopy:p=>events.push(['copy',p]),onTerminal:n=>events.push(['terminal',n]),onLock:(...args)=>events.push(['lock',...args]),onOpen:p=>events.push(['open',p]),onPrune:(...args)=>events.push(['prune',...args])};
const show=async(C,p)=>{root.render(React.createElement(C,p));await tick()};
document.getElementById('run').onclick=async()=>{try{
await show(RecoveryCheckpointsDialog,recovery);check(button('Create recovery branch').disabled,'Recovery requires explicit selection');input('Choose recovery checkpoint',entry.reference);await tick();check(field('Recovery branch name').value==='recovery/aaaaaaa','Recovery suggests target-specific branch');input('Recovery branch name','  recovery/my-work  ');await tick();button('Create recovery branch').click();await tick();check(JSON.stringify(events.at(-1))===JSON.stringify(['recover',entry.reference,entry.oid,'recovery/my-work']),'Recovery exact reference/OID and trimmed name');input('Filter recovery checkpoints','nothing');await tick();check(button('Create recovery branch').disabled&&document.body.textContent.includes('No matching checkpoints.'),'Filtering clears selection and prevents hidden target submission');input('Filter recovery checkpoints','');await tick();input('Choose recovery checkpoint',entry.reference);await tick();await show(RecoveryCheckpointsDialog,{...recovery,listing:{entries:[],truncated:false}});check(button('Create recovery branch').disabled,'Removed checkpoint cannot submit');await show(RecoveryCheckpointsDialog,{...recovery,busy:true,error:'STALE_CHECKPOINT'});check([...document.querySelectorAll('#root button,#root input,#root select')].every(e=>e.disabled),'Busy recovery disables all controls');check(document.querySelector('[role=alert]').textContent==='STALE_CHECKPOINT','Recovery error visible');await show(RecoveryCheckpointsDialog,{...recovery,writable:false});check(button('Create recovery branch').disabled,'Read-only recovery cannot create branch');button('Close').click();check(events.at(-1)[0]==='close','Recovery close callback');
await show(WorktreesDialog,worktree);const options=()=>[...field('Worktree branch').options].map(x=>x.value);check(JSON.stringify(options())===JSON.stringify(['','free']),'Worktree excludes main and already-used branches');check(button('Create worktree').disabled,'Worktree creation requires name/path');input('Worktree name',' new-tree ');input('New worktree path',' /synthetic/new ');input('Worktree branch','free');await tick();button('Create worktree').click();check(JSON.stringify(events.at(-1))===JSON.stringify(['create','new-tree','/synthetic/new','free']),'Worktree submits exact trimmed destination and branch');await show(WorktreesDialog,{...worktree,listing:{entries:[...worktree.listing.entries,{...wt,name:'newly-used',branch:'free'}],truncated:false}});check(button('Create worktree').disabled&&document.body.textContent.includes('selected branch is no longer available'),'Concurrent branch occupation disables creation');input('Worktree branch','');await tick();button('Create worktree').click();check(events.at(-1)[3]===null,'New branch selection submits null existing branch');
async function menu(name){field('Worktree actions: '+name).click();await tick();}
await menu('missing');check(['Inspect checkout','Open this worktree','Open terminal'].every(label=>button(label)?.disabled),'Missing worktree blocks inspect/open/terminal');check(button('Prune missing worktree').disabled,'Locked missing worktree cannot be pruned');button('Close').click();await tick();
await menu('linked');check(button('Prune missing worktree').disabled,'Existing worktree cannot be pruned');button('Lock this worktree').click();await tick();check(JSON.stringify(events.at(-1))===JSON.stringify(['lock','linked',false]),'Lock submits name and reviewed lock state');
input('Filter worktree state','locked');await tick();check(document.querySelectorAll('#root article').length===1&&document.querySelector('#root article').textContent.includes('/synthetic/missing'),'Locked filter reflects saved lock state');
await show(WorktreesDialog,{...worktree,busy:true});check(button('Create worktree').disabled&&field('Worktree name').disabled&&field('New worktree path').disabled,'Busy worktree blocks mutation fields');
await show(WorktreesDialog,{...worktree,canCreate:false});await menu('missing');check(button('Create worktree').disabled&&button('Unlock this worktree').disabled&&button('Prune missing worktree').disabled,'Read-only mode blocks create lock and prune');button('Close').click();await tick();
input('Filter worktree state','all');await tick();
const prunable={...worktree,listing:{entries:[{name:'gone',path:'/synthetic/gone',branch:'old',valid:false,locked:false,pruneToken:'a'.repeat(64)}],truncated:false}};
await show(WorktreesDialog,prunable);let row=document.querySelector('.reference-item');row.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:100,clientY:100}));await tick();check(!!document.querySelector('[role="menu"]'),'Worktree right-click opens shared menu inside dialog');check(!button('Prune missing worktree').disabled,'Reviewed missing unlocked worktree can be pruned');let before=events.length;button('Close').click();await tick();check(events.length===before,'Closing menu does not prune');
await menu('gone');button('Prune missing worktree').click();await tick();check(JSON.stringify(events.at(-1))===JSON.stringify(['prune','gone','a'.repeat(64)]),'Prune submits exact name and reviewed metadata token');
await show(WorktreesDialog,{...prunable,listing:{entries:[{...prunable.listing.entries[0],pruneToken:null}],truncated:false},error:'STALE_WORKTREE_METADATA'});await menu('gone');check(button('Prune missing worktree').disabled&&document.querySelector('[role="alert"]').textContent==='STALE_WORKTREE_METADATA','Changed unsupported metadata disables prune and displays failure');button('Close').click();await tick();
await show(WorktreesDialog,{...prunable,busy:true});check(field('Worktree actions: gone').disabled,'Busy prevents opening mutation menu');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks,scope:'Actual components, controlled props/callbacks; no native IPC/Git effects'},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
