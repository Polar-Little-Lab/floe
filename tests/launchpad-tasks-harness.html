<!doctype html><html><body><button id="run">Run task view checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
api.loadNamedWorkspaces=async()=>({workspace:null,revision:'missing',warning:null});
const root=createRoot(document.getElementById('root'));let prPending,issuePending,calls=[];
api.readGithubPullRequests=(o,r,p)=>{calls.push(['pr',o,r,p]);return new Promise((resolve,reject)=>prPending={resolve,reject})};api.readGithubIssues=(o,r,p)=>{calls.push(['issue',o,r,p]);return new Promise((resolve,reject)=>issuePending={resolve,reject})};root.render(React.createElement(LaunchpadTasks));
const tick=()=>new Promise(r=>setTimeout(r,50)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),field=(name,value)=>{const f=document.querySelector(`[aria-label="${name}"]`);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(f,value);f.dispatchEvent(new Event('input',{bubbles:true}))},shown=name=>{const s=document.querySelector(`[aria-label="${name}"]`);return s.getClientRects().length>0&&!s.closest('[hidden]')},page=(repository,items)=>({provider:'github',host:'github.com',repository,page:1,nextPage:null,items});
const pr={id:'same-id',number:7,title:'Only PR',author:'A',draft:false,headBranch:'feature',baseBranch:'main',requestedReviewers:[],labels:[],milestone:null,url:'https://github.com/o/p/pull/7'},issue={id:'same-id',number:7,title:'Only issue',author:'B',assignees:['Owner'],labels:['bug'],milestone:null,url:'https://github.com/o/i/issues/7'};
document.getElementById('run').onclick=async()=>{const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();check(shown('GitHub pull requests')&&!shown('GitHub issues')&&calls.length===0,'PR default shows one task type without unsolicited requests');button('All').click();await tick();check(shown('GitHub pull requests')&&shown('GitHub issues'),'All shows both task types');
button('Pull requests').click();await tick();check(shown('GitHub pull requests')&&!shown('GitHub issues')&&button('Pull requests').getAttribute('aria-pressed')==='true','PR view shows only PR section');
field('GitHub repository','o/p');await tick();button('Load pull requests').click();await tick();button('Issues').click();await tick();check(!shown('GitHub pull requests')&&shown('GitHub issues'),'switch while request pending');
field('GitHub issue repository','o/i');await tick();button('Load issues').click();await tick();issuePending.resolve(page('o/i',[issue]));await tick();prPending.resolve(page('o/p',[pr]));await tick();check(document.querySelector('[aria-label="GitHub issues"]').textContent.includes('Only issue')&&!document.querySelector('[aria-label="GitHub issues"]').textContent.includes('Only PR'),'late hidden PR response cannot mix identical ID into issues');
field('Filter loaded issues','bug');await tick();const label=document.querySelector('[aria-label="Filter issue label"]');label.value=JSON.stringify('bug');label.dispatchEvent(new Event('change',{bubbles:true}));await tick();
button('Pull requests').click();await tick();check(document.querySelector('[aria-label="GitHub pull requests"]').textContent.includes('Only PR')&&calls.length===2,'return restores completed PR without refetch');field('Filter loaded pull requests','Only PR');await tick();
button('Issues').click();await tick();check(document.querySelector('[aria-label="Filter loaded issues"]').value==='bug'&&document.querySelector('[aria-label="Filter issue label"]').value===JSON.stringify('bug'),'issue text and structured filters survive switching');
button('All').click();await tick();check(shown('GitHub pull requests')&&shown('GitHub issues')&&document.querySelector('[aria-label="Filter loaded pull requests"]').value==='Only PR','All restores both cached views and PR filter');check(calls.length===2,'view switches never request provider data');
root.render(React.createElement(LaunchpadTasks,{disabled:true}));await tick();check(['All','Pull requests','Issues','Load issues','Load pull requests'].every(name=>button(name).disabled),'parent busy state disables task controls');root.render(React.createElement(LaunchpadTasks));await tick();check(button('All').getAttribute('aria-pressed')==='true'&&!button('Issues').disabled,'busy clears without losing view');
field('GitHub issue repository','o/error');await tick();button('Load issues').click();await tick();issuePending.reject('PROVIDER_UNAVAILABLE');await tick();button('Pull requests').click();await tick();check(!shown('GitHub issues')&&document.querySelector('[aria-label="GitHub pull requests"]').textContent.includes('Only PR'),'issue error does not replace cached PR data');button('Issues').click();await tick();check(document.querySelector('[aria-label="GitHub issues"]').textContent.includes('PROVIDER_UNAVAILABLE'),'return retains issue error for retry');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
