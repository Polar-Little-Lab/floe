<!doctype html><html><body><div id="root"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {RepositoryIdentityDialog} from '/src/RepositoryIdentityDialog.tsx';import {repositoryDefaultIdentity} from '/src/commitIdentity.ts';import {useIdentityFields} from '/src/useIdentityFields.ts';

const local={identity:{name:'Work',email:'work@example.invalid'},configured:true,warning:null};const app={name:'Personal',email:'personal@example.invalid'};
window.show=(busy=false,initial=local)=>root.render(React.createElement(RepositoryIdentityDialog,{key:++epoch,name:'<work>',initial,busy,error:'',onClose:()=>events.push(['cancel']),onSave:identity=>events.push(['save',identity])}));

input('Repository author name',' Other Work ');input('Repository author email',' other@example.invalid ');await tick();button('Save repository identity').click();assert(JSON.stringify(events.pop())===JSON.stringify(['save',{name:'Other Work',email:'other@example.invalid'}]),'save complete trimmed pair');
input('Repository author email','');await tick();assert(button('Save repository identity').disabled,'partial pair disabled');document.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));assert(events.length===0,'partial submit refused');
input('Repository author name','가'.repeat(100));input('Repository author email','ok@example.invalid');await tick();assert(button('Save repository identity').disabled,'UTF8 byte bound');
button('Clear repository identity').click();assert(JSON.stringify(events.pop())===JSON.stringify(['save',null]),'clear callback explicit');
window.show(true);await tick();assert([...document.querySelectorAll('input,button')].every(e=>e.disabled),'busy disables controls');document.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));assert(events.length===0,'busy submit refused');

input('effective-name','Explicit');await tick();root.render(React.createElement(Fields,{repository:local}));await tick();assert(field('effective-name').value==='Explicit'&&field('effective-email').value==='personal@example.invalid','entered operation pair preserved on default change');

</script></body></html>
