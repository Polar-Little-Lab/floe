<!doctype html><html><head><style>button,input,select{margin:3px}.hidden{display:none}.modal-backdrop{position:fixed;inset:0;background:#ddd9;display:grid;place-items:center}.dialog{background:white;padding:20px}</style></head><body><main id="root"><section id="background"><button id="opener">Open</button><button id="outside">Outside</button></section><section id="preexisting" inert><button>Already inert</button></section></main><script type="module">
import {installModalFocus,modalTabStops} from '/src/modalFocus.ts';
import React from 'react';import{createRoot}from'react-dom/client';import{PushDestinationDialog}from'/src/PushDestinationDialog.tsx';
const root=document.getElementById('root');window.busy=false;window.backgroundKeys=0;window.events=[];window.cleanup=installModalFocus(root,()=>!window.busy);window.stops=id=>modalTabStops(document.getElementById(id)).map(x=>x.id);
window.openDialog=(id='a',content='')=>{const wrapper=document.createElement('div');wrapper.className='modal-backdrop';wrapper.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="Test ${id}" id="${id}"><button id="${id}-close" data-modal-close>Close</button><input id="${id}-input"><button id="${id}-disabled" disabled>Disabled</button><input id="${id}-hidden" type="hidden"><button id="${id}-last">Last</button>${content}</section>`;root.append(wrapper);wrapper.querySelector('[data-modal-close]').onclick=()=>{window.events.push('close-'+id);wrapper.remove()};return wrapper;};
document.getElementById('opener').onclick=()=>window.openDialog();window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k')window.backgroundKeys++;if(e.key==='Escape')window.events.push('background-escape')});
let reactRoot;window.openPush=()=>{const host=document.createElement('div');host.id='react-host';root.append(host);reactRoot=createRoot(host);reactRoot.render(React.createElement(PushDestinationDialog,{name:'origin',source:'main',sourceOid:'a'.repeat(40),branches:['main'],busy:false,error:'',onClose:()=>{reactRoot.unmount();host.remove();window.events.push('push-close')},onPreview:()=>window.events.push('push-preview')}));};
</script><script type="module" src="/tests/modal-focus-checks.js"></script></body></html>
