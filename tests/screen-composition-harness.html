<!doctype html><html><body><div id="root"></div><div id="test-controls" style="position:fixed;right:12px;bottom:8px;max-width:340px;font-size:10px;z-index:100;background:#272a31;padding:6px"><button id="run">Run screen checks</button><button id="settings">Show settings</button><button id="launchpad">Show Launchpad</button><button id="hide">Hide test controls</button><span id="result" style="display:block;max-height:32px;overflow:auto">Not run</span></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import App from '/src/App.tsx';import {api} from '/src/api.ts';import '/src/original-theme.css';import '/src/styles.css';import '/src/light-theme.css';
api.loadNamedWorkspaces=async()=>({workspace:null,revision:'missing',warning:null});
api.readGithubPullRequests=async(owner,repo,page)=>({provider:'github',host:'github.com',repository:owner+'/'+repo,page,nextPage:null,items:[{id:'1',number:42,title:'Improve repository search and navigation',author:'alex',draft:false,headBranch:'feature/search',baseBranch:'main',requestedReviewers:['sam'],labels:['enhancement'],milestone:null,url:'https://github.com/'+owner+'/'+repo+'/pull/42'},{id:'2',number:39,title:'Preserve local changes during checkout',author:'sam',draft:true,headBranch:'fix/checkout',baseBranch:'main',requestedReviewers:[],labels:['bug'],milestone:null,url:'https://github.com/'+owner+'/'+repo+'/pull/39'}]});
api.readGithubIssues=async(owner,repo,page)=>({provider:'github',host:'github.com',repository:owner+'/'+repo,page,nextPage:null,items:[{id:'3',number:18,title:'Improve workspace navigation',author:'alex',assignees:['sam'],labels:['enhancement'],milestone:null,url:'https://github.com/'+owner+'/'+repo+'/issues/18'}]});
createRoot(document.getElementById('root')).render(React.createElement(App));
const tick=()=>new Promise(r=>setTimeout(r,60));const button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t);const label=t=>document.querySelector(`[aria-label="${t}"]`);const visible=e=>e&&!e.closest('[hidden]')&&e.getClientRects().length>0;
async function value(name,v){let e=label(name);Object.getOwnPropertyDescriptor(e instanceof HTMLSelectElement?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(e,v);e.dispatchEvent(new Event(e instanceof HTMLSelectElement?'change':'input',{bubbles:true}));await tick();}
async function close(){const dialog=document.querySelector('[aria-modal="true"]');if(dialog){dialog.querySelector('[data-modal-close]').click();await tick();}}
async function showSettings(){await close();label('설정').click();await tick();}
async function showLaunchpad(){await close();button('Launchpad').click();await tick();await value('GitHub repository','example/project');button('Load pull requests').click();await tick();}
document.getElementById('hide').onclick=()=>document.getElementById('test-controls').hidden=true;document.getElementById('settings').onclick=showSettings;document.getElementById('launchpad').onclick=showLaunchpad;
document.getElementById('run').onclick=async()=>{const checks=[],assert=(ok,n)=>{if(!ok)throw Error(n);checks.push(n)};try{
 await showSettings();assert(visible(label('Theme')),'settings opens UI Customization');assert(document.querySelector('.screen-sidebar')&&document.querySelector('.screen-main'),'reference sidebar/content composition');
 const previous=label('Theme').value;await value('Theme',previous==='dark'?'light':'dark');assert(localStorage.getItem('branchdesk-theme')!==previous,'theme control persists');await value('Theme',previous);
 button('Profiles').click();await tick();assert(visible(label('Default author name'))&&!visible(label('Theme')),'Profiles shows identity and hides appearance');
 button('Editor').click();await tick();assert(visible(label('Preferred diff layout')),'Editor shows existing diff preferences');const mode=label('Preferred diff layout').value;await value('Preferred diff layout',mode==='split'?'unified':'split');assert(JSON.parse(localStorage.getItem('branchdesk.diff-view.v1')).mode!==mode,'editor saves preference');await value('Preferred diff layout',mode);
 button('General').click();await tick();assert(visible(button('Edit repository identity')),'General retains repository identity action');button('Keyboard Shortcuts').click();await tick();assert(document.querySelector('.screen-content').textContent.includes('Search commits'),'shortcut help retained');
 await showLaunchpad();assert(label('Launchpad').getAttribute('role')==='region'&&!label('Launchpad').hasAttribute('aria-modal'),'Launchpad is a navigable page');assert(!document.querySelector('.tabbar').inert,'Launchpad leaves repository tabs interactive');label('설정').click();await tick();assert(visible(label('Theme')),'top settings button works while Launchpad is open');await close();assert(visible(label('GitHub pull requests'))&&!document.querySelector('.tabbar').inert,'closing settings restores Launchpad navigation');assert(visible(label('GitHub pull requests'))&&!visible(label('GitHub issues')),'Launchpad opens PR tab only');assert(label('Pull requests').tagName==='TABLE'&&label('Pull requests').querySelectorAll('tbody tr').length===2,'PR uses shared six-column table');
 button('Issues').click();await tick();await value('GitHub issue repository','example/project');button('Load issues').click();await tick();assert(label('Issues').tagName==='TABLE'&&label('Issues').querySelectorAll('tbody tr').length===1,'Issue uses shared table');
 button('Repositories').click();await tick();assert(visible(button('Open repository'))&&!visible(label('GitHub issues')),'repository actions isolated in repository tab');button('Pull requests').click();await tick();assert(label('Pull requests').querySelectorAll('tbody tr').length===2,'switching tabs retains loaded PRs');
 button('Open Pull Request Panel').click();await tick();assert(visible(document.querySelector('[aria-label="Pull Request #42"]')),'PR table opens existing detail panel');label('Close provider panel').click();await tick();
 document.getElementById('result').textContent=JSON.stringify({passed:checks.length,failed:0,checks});
 }catch(e){document.getElementById('result').textContent=JSON.stringify({passed:checks.length,failed:1,error:String(e),checks});}};
</script></body></html>
