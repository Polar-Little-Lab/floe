<!doctype html><html><body><button id="run">Run Launchpad recovery</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import App from'/src/App.tsx';import{api}from'/src/api.ts';import{demo}from'/src/demo.ts';
const key='branchdesk.repository-pins.v1',original=localStorage.getItem(key);localStorage.setItem(key,JSON.stringify(['/tmp/launchpad-recovery-fixture']));
let pending,calls=[];api.openPath=path=>{calls.push(path);return new Promise((resolve,reject)=>pending={resolve,reject})};api.refresh=id=>new Promise((resolve,reject)=>pending={resolve,reject});api.loadDraft=async()=>({draft:null,revision:'missing',warning:null});api.saveDraft=async(id,revision,draft)=>({draft,revision:'saved',warning:null});api.saveWorkspace=async()=>({workspace:null,revision:'saved',warning:null});api.commit=async()=>({oid:'',parentOid:null,message:'',files:[]});
const root=createRoot(document.getElementById('root'));root.render(React.createElement(App));const tick=()=>new Promise(r=>setTimeout(r,70)),button=(text,parent=document)=>[...parent.querySelectorAll('button')].find(b=>b.textContent===text),dialog=()=>document.querySelector('[aria-label="Launchpad"]');
document.getElementById('run').onclick=async()=>{const checks=[],assert=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{await tick();button('Launchpad').click();await tick();const input=dialog().querySelector('[aria-label="Filter repositories"]');Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(input,'recovery');input.dispatchEvent(new Event('input',{bubbles:true}));await tick();
button('/tmp/launchpad-recovery-fixture',dialog()).click();await tick();assert(!!dialog(),'opening retains Launchpad');assert(button('/tmp/launchpad-recovery-fixture',dialog()).disabled,'open disabled while busy');assert(dialog().querySelector('[aria-label="Close Launchpad"]').disabled,'close disabled while busy');pending.reject('MISSING_REPOSITORY');await tick();assert(!!dialog()&&dialog().querySelector('[aria-label="Filter repositories"]').value==='recovery','failure preserves filter and list');assert(dialog().querySelector('[role="alert"]').textContent==='MISSING_REPOSITORY','error visible inside Launchpad');
button('/tmp/launchpad-recovery-fixture',dialog()).click();await tick();pending.resolve(null);await tick();assert(!!dialog()&&dialog().querySelector('[aria-label="Filter repositories"]').value==='recovery','cancel preserves filter and list');assert(!dialog().querySelector('[role="alert"]'),'retry clears prior error');
button('/tmp/launchpad-recovery-fixture',dialog()).click();await tick();pending.resolve({...structuredClone(demo),repoId:'opened-fixture',name:'Opened fixture'});await tick();assert(!dialog(),'successful activation closes Launchpad');assert(!!button('Opened fixture'),'opened repository tab visible');assert(calls.length===3&&calls.every(x=>x==='/tmp/launchpad-recovery-fixture'),'all attempts use exact selected path');button('Launchpad').click();await tick();button('Opened fixture',dialog()).click();await tick();assert(!dialog(),'selecting active tab closes Launchpad');
button('Launchpad').click();await tick();button('/tmp/launchpad-recovery-fixture',dialog()).click();await tick();pending.resolve({...structuredClone(demo),repoId:'second-fixture',name:'Second fixture'});await tick();assert(!dialog()&&!!button('Second fixture'),'second repository activation succeeds');button('Launchpad').click();await tick();button('Opened fixture',dialog()).click();await tick();assert(!!dialog(),'switching tab keeps Launchpad while pending');pending.reject('SESSION_NOT_FOUND');await tick();assert(dialog().querySelector('[role="alert"]').textContent==='SESSION_NOT_FOUND','tab switch failure visible and retryable');button('Opened fixture',dialog()).click();await tick();pending.resolve({...structuredClone(demo),repoId:'opened-fixture',name:'Opened fixture'});await tick();assert(!dialog(),'successful tab switch closes Launchpad');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}finally{root.unmount();if(original===null)localStorage.removeItem(key);else localStorage.setItem(key,original)}};
</script></body></html>
