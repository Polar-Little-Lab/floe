<!doctype html><html><body><button id="run">Run workspace feed checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
const groups=[{id:'a',name:'Alpha',repositories:[{owner:'o',repo:'a',localPath:null},{owner:'o',repo:'b',localPath:null}]},{id:'b',name:'Beta',repositories:[{owner:'o',repo:'c',localPath:null}]}];let store={workspace:{groups,selected:'a'},revision:'1',warning:null},calls=[],fail=true,hold=false,pending,omitMilestone=false;
api.loadNamedWorkspaces=async()=>structuredClone(store);api.saveNamedWorkspaces=async(revision,workspace)=>{store={workspace,revision:'2',warning:null};return structuredClone(store)};
const item=(r,kind)=>({id:'same',number:1,title:r+' '+kind,author:r==='a'?'Alice':'Bob',...(kind==='pulls'?{draft:false,headBranch:'branch',baseBranch:'main',requestedReviewers:[]}:{assignees:[]}),labels:['bug'],milestone:omitMilestone?null:{number:'1',title:'Release'},url:`https://github.com/o/${r}/${kind==='pulls'?'pull':'issues'}/1`}),page=(r,p,kind)=>({provider:'github',host:'github.com',repository:'o/'+r,page:p,nextPage:r==='a'&&kind==='issues'&&p===1?2:null,items:r==='a'&&kind==='issues'&&p===1?[]:[item(r,kind)]});
const read=kind=>async(o,r,p)=>{calls.push([r,kind,p]);if(hold)await new Promise(resolve=>pending=resolve);if(r==='b'&&kind==='issues'&&fail)throw Error('PROVIDER_UNAVAILABLE');return page(r,p,kind)};api.readGithubPullRequests=read('pulls');api.readGithubIssues=read('issues');createRoot(document.getElementById('root')).render(React.createElement(LaunchpadTasks));
const tick=()=>new Promise(r=>setTimeout(r,50)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),rows=()=>document.querySelectorAll('[aria-label="Workspace task results"] .recent-repository'),result=()=>document.querySelector('[aria-label="Workspace task results"]'),input=(label,value)=>{const f=document.querySelector(`[aria-label="${label}"]`);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(f,value);f.dispatchEvent(new Event('input',{bubbles:true}))};
document.getElementById('run').onclick=async()=>{const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();check(result().textContent.includes('Alpha')&&calls.length===0,'selected group restores without automatic provider reads');check(!!document.querySelector('[aria-label="GitHub issues"]').closest('[hidden]'),'standalone queries hidden under selected workspace');
button('Load workspace tasks').click();await tick();check(JSON.stringify(calls)===JSON.stringify([['a','pulls',1],['a','issues',1],['b','pulls',1],['b','issues',1]]),'loads exactly selected repository sources sequentially');check(rows().length===2&&result().textContent.includes('PROVIDER_UNAVAILABLE'),'one source failure preserves successful repositories with identical IDs');check(!!button('Load more o/a issues')&&result().textContent.includes('No items in loaded pages.'),'PR-only issue source preserves pagination');
fail=false;button('Retry o/b issues').click();await tick();check(rows().length===3,'retry loads failed source independently');button('Load more o/a issues').click();await tick();check(rows().length===4&&!button('Load more o/a issues'),'source next page adds issue without cross-repository deduplication');check(result().textContent.includes('branch → main')&&result().textContent.includes('Assignees: None listed'),'workspace rows retain kind-specific metadata');
const choose=async(kind,value)=>{const control=document.querySelector(`[aria-label="Filter workspace ${kind}"]`);control.value=value===null?'':JSON.stringify(value);control.dispatchEvent(new Event('change',{bubbles:true}));await tick()};
check(document.querySelector('[aria-label="Filter workspace milestone"]').options.length===3,'same milestone number/title remains separate across repositories');
await choose('milestone',JSON.stringify(['o/a','1']));check(rows().length===2&&[...rows()].every(row=>row.textContent.includes('a ')),'workspace milestone scopes to its repository only');await choose('author','bob');check(rows().length===0,'workspace author and milestone intersect');await choose('author','alice');await choose('label','bug');check(rows().length===2,'author label and milestone filters combine');button('Issues').click();await tick();check(rows().length===1,'task type view retains structured filters');button('All').click();await tick();await choose('author',null);await choose('label',null);await choose('milestone',null);check(rows().length===4,'clearing workspace filters restores cached rows');
const requestsBeforeReorder=calls.length;button('Move workspace down').click();await tick();check(rows().length===4&&calls.length===requestsBeforeReorder,'workspace reorder preserves loaded results without refetch');button('Reload workspaces').click();await tick();check(rows().length===4&&calls.length===requestsBeforeReorder,'unchanged membership reload preserves loaded results');
button('Issues').click();await tick();check(rows().length===2&&result().textContent.includes('a issues')&&!result().textContent.includes('a pulls'),'task view limits workspace rows by kind');input('Search workspace tasks','o/b bug');await tick();check(rows().length===1&&rows()[0].textContent.includes('b issues'),'workspace query includes repository and labels');button('All').click();await tick();check(rows().length===2,'All retains query across task types');input('Search workspace tasks','');await tick();
hold=true;button('Load workspace tasks').click();await tick();button('Stop loading workspace').click();await tick();check(result().textContent.includes('Loading stopped')&&rows().length===4,'stop preserves completed rows');const count=calls.length;hold=false;pending();await tick();check(calls.length===count&&rows().length===4,'stopped refresh does not issue remaining requests or overwrite rows');
const select=document.querySelector('[aria-label="Selected workspace"]');select.value='b';select.dispatchEvent(new Event('change',{bubbles:true}));await tick();check(result().textContent.includes('Beta')&&rows().length===0,'workspace switch clears old group results');button('Load workspace tasks').click();await tick();check(rows().length===2&&calls.slice(-2).every(c=>c[0]==='c'),'new workspace reads only its members');
await choose('milestone',JSON.stringify(['o/c','1']));omitMilestone=true;button('Load workspace tasks').click();await tick();check(rows().length===0&&document.querySelector('[aria-label="Filter workspace milestone"]').selectedOptions[0].textContent.includes('not in loaded results'),'refresh retains now-missing workspace milestone instead of clearing restriction');

document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
