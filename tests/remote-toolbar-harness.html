<!doctype html><html><body><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import {demo} from '/src/demo.ts';import{api}from'/src/api.ts';import App from '/src/App.tsx';import '/src/original-theme.css';import '/src/styles.css';import '/src/light-theme.css';
const root=createRoot(document.getElementById('root'));const base=structuredClone(demo);const oid=base.commits[0].oid;let epoch=0;window.calls=[];let current;
const remote=name=>({name,fetchUrls:[`https://example.invalid/${name}`],pushUrls:[],fetchRefspecs:[],branches:[{name:'release',oid,symbolicTarget:null}]});
window.mount=(overrides={})=>{current={...structuredClone(base),repoId:'fixture',revision:'frozen',headOid:oid,detached:false,branch:'topic',branches:[{name:'topic',oid,current:true,upstream:{remotes:['work'],merges:['refs/heads/release']}}],remotes:[remote('work'),remote('other')],changes:[],writeBlock:null,recoveryPending:false,pushRecord:null,pushRecordError:null,...overrides};Object.assign(demo,current);root.render(React.createElement(App,{key:++epoch}));};
api.preparePull=async(snapshot,name)=>{calls.push(['pull',snapshot.repoId,snapshot.revision,name]);return null};
api.previewPush=async(snapshot,name,branch)=>{calls.push(['preview',snapshot.repoId,snapshot.revision,name,branch]);return null};
api.executePush=async()=>{throw new Error('Unexpected executePush in preview test')};api.refresh=async()=>structuredClone(current);
api.loadDraft=async()=>({draft:null,revision:'missing',warning:null});api.saveDraft=async(id,revision,draft)=>({draft,revision:'saved',warning:null});api.saveWorkspace=async()=>({workspace:null,revision:'saved',warning:null});
window.mount();
window.runChecks=async()=>{const checks=[];const tick=()=>new Promise(r=>setTimeout(r,50));const assert=(ok,name)=>{if(!ok)throw new Error(name);checks.push(name)};const tool=name=>[...document.querySelectorAll('.toolbar .tool')].find(b=>b.textContent===name);const button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent===text);const dialog=name=>document.querySelector(`[role=dialog][aria-label="${name}"]`);await tick();
tool('Pull').click();await tick();assert(JSON.stringify(calls.pop())===JSON.stringify(['pull','fixture','frozen','work']),'App toolbar Pull uses configured remote');assert(document.body.textContent.includes('Pull을 취소했습니다'),'Pull cancellation displayed');
tool('Push').click();await tick();assert(!!dialog('Choose push remote'),'App toolbar opens remote chooser');assert(button('Choose destination').disabled,'multiple remotes require choice');assert(calls.length===0,'no network on remote chooser');
const select=document.querySelector('[aria-label="Push remote"]');select.value='other';select.dispatchEvent(new Event('change',{bubbles:true}));await tick();button('Choose destination').click();await tick();assert(!!dialog('Choose push destination')&&!dialog('Choose push remote'),'remote chooser transitions to branch chooser');
const input=document.querySelector('[aria-label="Push destination branch"]');Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(input,'release/v2');input.dispatchEvent(new Event('input',{bubbles:true}));await tick();
current={...current,revision:'changed'};window.dispatchEvent(new Event('focus'));await tick();button('Preview destination').click();await tick();assert(JSON.stringify(calls.pop())===JSON.stringify(['preview','fixture','frozen','other','release/v2']),'App retains frozen revision and exact chosen destination after refresh');assert(!!dialog('Choose push destination'),'cancelled native preview retains destination input');button('Cancel').click();await tick();assert(!dialog('Choose push destination')&&calls.length===0,'cancel sends no further request');
window.mount({branches:[{name:'topic',oid,current:true,upstream:{remotes:[],merges:[]}}]});await tick();tool('Pull').click();await tick();assert(!!dialog('Configure upstream')&&calls.length===0,'missing upstream opens editor without network');button('Cancel').click();await tick();
window.mount({remotes:[]});await tick();tool('Pull').click();await tick();assert(document.body.textContent.includes('Add remote')&&calls.length===0,'missing remote opens Add remote');
window.mount({detached:true});await tick();assert(tool('Pull').disabled&&tool('Push').disabled,'detached toolbar transfer actions disabled');
window.mount({headOid:null});await tick();assert(tool('Pull').disabled&&tool('Push').disabled,'unborn toolbar transfer actions disabled');
window.mount({pushRecordError:'invalid saved push record'});await tick();assert(tool('Push').disabled,'damaged push record blocks toolbar Push');
window.mount({writeBlock:'read only'});await tick();assert(tool('Pull').disabled&&tool('Push').disabled,'read-only repository toolbar disabled');
return {passed:checks.length,checks,scope:'Actual App rendered with isolated synthetic snapshots and mocked api callbacks. No native IPC/network/WKWebView verification.'};};
window.runBusyChecks=async()=>{window.mount();await new Promise(r=>setTimeout(r,60));const previous=api.preparePull;let resolve;let count=0;api.preparePull=()=>{count++;return new Promise(r=>resolve=r)};const get=name=>[...document.querySelectorAll('.toolbar .tool')].find(b=>b.textContent===name);try{get('Pull').click();await new Promise(r=>setTimeout(r,60));if(!get('Pull').disabled||!get('Push').disabled)throw Error('busy actions enabled');get('Pull').click();get('Push').click();if(count!==1)throw Error('duplicate request');resolve(null);await new Promise(r=>setTimeout(r,60));if(get('Pull').disabled||get('Push').disabled)throw Error('busy not released');return {passed:3,checks:['pending Pull disables both toolbar actions','duplicate click does not request again','cancelled Pull restores enabled actions']}}finally{api.preparePull=previous;resolve?.(null)}};
</script></body></html>
