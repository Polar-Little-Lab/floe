<!doctype html><html><body><button id="run">Run snooze checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
let clock=1800000000000;Date.now=()=>clock;let record={workspace:{selected:'a',snoozes:[],groups:[{id:'a',name:'Alpha',repositories:[{owner:'o',repo:'r',localPath:null}],views:[]}]},revision:'1',warning:null},reads=0,writes=0;
api.loadNamedWorkspaces=async()=>structuredClone(record);api.saveNamedWorkspaces=async(revision,workspace)=>{if(revision!==record.revision)throw Error('STALE_WORKSPACE');writes++;record={workspace:structuredClone(workspace),revision:String(+record.revision+1),warning:null};return structuredClone(record)};
api.readGithubPullRequests=async(o,r,p)=>{reads++;return{provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[{id:'1',number:1,title:'Pull title',author:'alice',headBranch:'topic',baseBranch:'main',draft:false,requestedReviewers:[],labels:[],milestone:null,url:'https://github.com/o/r/pull/1'}]}};api.readGithubIssues=async(o,r,p)=>{reads++;return{provider:'github',host:'github.com',repository:o+'/'+r,page:p,nextPage:null,items:[{id:'1',number:2,title:'Issue title',author:'bob',assignees:[],labels:[],milestone:null,url:'https://github.com/o/r/issues/2'}]}};
const root=createRoot(document.getElementById('root'));root.render(React.createElement(LaunchpadTasks));const tick=()=>new Promise(r=>setTimeout(r,70)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),label=n=>document.querySelector(`[aria-label="${n}"]`),rows=k=>label('o/r '+k)?.querySelectorAll('.recent-repository').length??0,input=async(n,v)=>{const e=label(n);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));await tick()};
document.getElementById('run').onclick=async()=>{let checks=[];const check=(ok,n)=>{if(!ok)throw Error(n);checks.push(n)};try{await tick();button('Load workspace tasks').click();await tick();check(rows('pulls')===1&&rows('issues')===1,'two task types loaded with same opaque ID');button('Pin task').click();await tick();check(record.workspace.pins.length===1&&label('o/r pulls').textContent.includes('Unpin task')&&label('o/r issues').textContent.includes('Pin task'),'pin persists and isolates task type');[...label('o/r pulls').querySelectorAll('button')].find(b=>b.textContent==='Snooze 1 hour').click();await tick();check(record.workspace.snoozes.length===1&&record.workspace.snoozes[0].until===clock+3600000,'1h snooze persisted');check(rows('pulls')===0&&rows('issues')===1,'snooze only hides target type');button('Snoozed').click();await tick();check(rows('pulls')===1&&rows('issues')===0,'Snoozed includes only active records');check(label('o/r pulls').textContent.includes('Unpin task')&&record.workspace.pins.length===1,'Snooze preserves pin');button('Unsnooze').click();await tick();check(record.workspace.snoozes.length===0&&rows('pulls')===0,'unsnooze removes saved record');button('All').click();await tick();check(rows('pulls')===1,'unsnooze returns item');
record.revision='100';button('Snooze 4 hours').click();await tick();check(record.workspace.snoozes.length===0&&rows('pulls')===1&&document.body.textContent.includes('STALE_WORKSPACE'),'failed save keeps row visible and data unchanged');button('Reload saved views').click();await tick();button('Snooze 4 hours').click();await tick();check(record.workspace.snoozes[0].until===clock+14400000,'reload and retry persists4h');
root.render(null);await tick();root.render(React.createElement(LaunchpadTasks));await tick();const before=reads;button('Snoozed').click();await tick();check(label('Snoozed tasks without loaded details')?.textContent.includes('ID 1')&&reads===before,'remount exposes saved snooze without fetching');button('Unsnooze saved task').click();await tick();check(record.workspace.snoozes.length===0,'unloaded saved task can be unsnoozed');check(record.workspace.pins.length===1,'restart and unsnooze preserve pin');
button('Load workspace tasks').click();await tick();button('All').click();await tick();button('Snooze 1 hour').click();await tick();clock+=3600000;await new Promise(r=>setTimeout(r,1100));check(rows('pulls')===1&&record.workspace.snoozes.length===1,'expiry restores cached item without storage mutation');check(label('o/r pulls').textContent.includes('Unpin task'),'reloaded task restores pinned state');button('Unpin task').click();await tick();check(record.workspace.pins.length===0&&record.workspace.snoozes.length===1,'unpin leaves snooze history intact');
button('Snooze 1 hour').click();await tick();await input('Workspace name','New group');button('Create workspace').click();await tick();check(record.workspace.snoozes.length===1&&record.workspace.groups.length===2,'creating group preserves global snoozes');button('Remove workspace').click();await tick();button('Confirm workspace removal').click();await tick();check(record.workspace.snoozes.length===1&&record.workspace.groups.length===1,'removing group preserves global snoozes');

const reader=api.readGithubPullRequests;api.readGithubPullRequests=async(...args)=>{const page=await reader(...args);return {...page,items:[page.items[0],{...page.items[0],id:'2',number:3,title:'Second pull'}]}};const sel=label('Selected workspace');sel.value='a';sel.dispatchEvent(new Event('change',{bubbles:true}));await tick();button('Snoozed').click();await tick();button('Unsnooze saved task').click();await tick();button('All').click();await tick();button('Load workspace tasks').click();await tick();
const pullRows=()=>[...label('o/r pulls').querySelectorAll('.recent-repository')],pinSecond=()=>[...pullRows()[1].querySelectorAll('button')].find(b=>b.textContent==='Pin task');pinSecond().click();await tick();check(pullRows()[0].textContent.includes('Second pull')&&pullRows()[1].textContent.includes('Pull title'),'pin moves second task ahead of first');button('Unpin task').click();await tick();check(pullRows()[0].textContent.includes('Pull title'),'unpin restores provider order');
record.revision='500';pinSecond().click();await tick();check(record.workspace.pins.length===0&&pullRows()[0].textContent.includes('Pull title')&&document.body.textContent.includes('STALE_WORKSPACE'),'stale pin save preserves order and persisted pins');button('Reload saved views').click();await tick();pinSecond().click();await tick();check(record.workspace.pins[0].id==='2','reload and retry pins intended task');
root.render(null);await tick();root.render(React.createElement(LaunchpadTasks));await tick();const beforePinReads=reads;check(label('Pinned tasks without loaded details')?.textContent.includes('ID 2')&&reads===beforePinReads,'unloaded pin survives remount without fetching');button('Unpin saved task').click();await tick();check(record.workspace.pins.length===0&&!label('Pinned tasks without loaded details'),'unloaded pin can be removed');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
