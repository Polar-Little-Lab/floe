<!doctype html><html><body><button id="run">Run issue UI checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{LaunchpadIssues}from'/src/LaunchpadIssues.tsx';import{api}from'/src/api.ts';
let pending,calls=[];api.readGithubIssues=(owner,repo,page)=>{calls.push({owner,repo,page});return new Promise((resolve,reject)=>pending={resolve,reject})};createRoot(document.getElementById('root')).render(React.createElement(LaunchpadIssues));
const tick=()=>new Promise(r=>setTimeout(r,50)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),text=()=>document.querySelector('#root').textContent,rows=()=>document.querySelectorAll('.provider-table tbody tr'),input=(label,value)=>{const f=document.querySelector(`[aria-label="${label}"]`);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(f,value);f.dispatchEvent(new Event('input',{bubbles:true}))},page=(n,items,nextPage)=>({provider:'github',host:'github.com',repository:'o/r',page:n,items,nextPage}),item={id:'9007199254740993',number:9,title:'<img src=x onerror=alert(1)>',author:null,assignees:null,labels:['bug'],milestone:{number:'4',title:'Release'},url:'https://github.com/o/r/issues/9'};
document.getElementById('run').onclick=async()=>{let checks=[];const check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();check(button('Load issues').disabled&&text().includes('Enter a public GitHub repository as owner/repository'),'empty issue repository explains disabled actions');input('GitHub issue repository','o/r/bad');await tick();button('Load issues').click();await tick();check(calls.length===0&&!!document.querySelector('[role="alert"]'),'invalid scope refuses request');
input('GitHub issue repository','o/r');await tick();button('Load issues').click();await tick();check(button('Load issues').disabled,'busy request disables submit');pending.resolve(page(1,[],2));await tick();check(text().includes('No issues in loaded pages. More pages are available.')&&!!button('Load more issues'),'PR-only page retains next page and partial-empty message');
button('Load more issues').click();await tick();pending.reject('PROVIDER_ACCESS_OR_RATE_LIMIT');await tick();check(!!document.querySelector('[role="alert"]')&&!!button('Load more issues'),'page failure retains retry');button('Load more issues').click();await tick();check(calls[2].page===2,'retry requests same page');pending.resolve(page(2,[item],3));await tick();check(rows().length===1&&text().includes(item.title)&&!document.querySelector('#root img'),'untrusted issue title rendered as text');check(rows()[0].querySelectorAll('td')[3].textContent==='Unknown'&&text().includes('Milestone: Release'),'unknown assignees and real metadata shown');
input('Filter loaded issues','bug release');await tick();check(rows().length===1,'metadata search matches');input('Filter loaded issues','no match');await tick();check(rows().length===0&&text().includes('No matching loaded issues.'),'search no-match distinct from empty repository');input('Filter loaded issues','');await tick();check(rows().length===1,'clear search restores cache');
button('Load more issues').click();await tick();pending.reject('PROVIDER_TIMEOUT');await tick();check(rows().length===1&&text().includes('PROVIDER_TIMEOUT'),'later page error preserves loaded row');button('Load more issues').click();await tick();pending.resolve(page(3,[item,{...item,id:'2',number:10,title:'Second',assignees:[]}],null));await tick();check(rows().length===2&&!button('Load more issues'),'deduplicate IDs and stop at final page');check(rows()[1].querySelectorAll('td')[3].textContent==='None listed','known empty assignees distinct from unknown');
const choose=async(name,value)=>{const control=document.querySelector(`[aria-label="Filter issue ${name}"]`);control.value=value===null?'':JSON.stringify(value);control.dispatchEvent(new Event('change',{bubbles:true}));await tick()};
button('Load issues').click();await tick();pending.resolve(page(1,[{...item,assignees:['Alice']},{...item,id:'2',number:10,title:'Second',assignees:['Bob'],labels:['Bug'],milestone:{number:'5',title:'Release'}}],2));await tick();
check(document.querySelector('[aria-label="Filter issue milestone"]').options.length===3,'same milestone title retains separate numeric identities');
await choose('assignee','Alice');check(rows().length===1&&text().includes(item.title),'assignee filter selects matching row');
await choose('label','Bug');check(rows().length===0,'assignee and exact label intersect');await choose('label','bug');await choose('milestone','4');check(rows().length===1,'all three filters match same issue');
await choose('milestone','5');check(rows().length===0,'same milestone title does not merge identities');
await choose('assignee','Bob');await choose('label','Bug');check(rows().length===1&&text().includes('Second'),'changing conditions restores correct issue');
button('Load more issues').click();await tick();pending.resolve(page(2,[{...item,id:'3',number:11,title:'Third',assignees:['Bob'],labels:['Bug'],milestone:{number:'5',title:'Release'}}],null));await tick();check(rows().length===2,'next page retains filters and includes new matches');
button('Load issues').click();await tick();pending.resolve(page(1,[item],null));await tick();check(rows().length===0&&document.querySelector('[aria-label="Filter issue assignee"]').selectedOptions[0].textContent.includes('not in loaded results'),'same repository refresh preserves missing selections');
input('GitHub issue repository','o/other');await tick();button('Load issues').click();await tick();pending.resolve({...page(1,[item],null),repository:'o/other'});await tick();check(rows().length===1&&['assignee','label','milestone'].every(name=>document.querySelector(`[aria-label="Filter issue ${name}"]`).value===''),'repository change resets scoped filters');
input('GitHub issue repository','o/r');await tick();button('Load issues').click();await tick();pending.resolve(page(1,[],null));await tick();check(text().includes('No open issues.')&&!button('Load more issues'),'exhausted empty repository message');document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
