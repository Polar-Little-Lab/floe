<!doctype html><html><body><button id="run">Run linked write checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{demo}from'/src/demo.ts';import{api}from'/src/api.ts';import App from'/src/App.tsx';
const change={...demo.changes[0],id:'a'.repeat(64),path:'linked.txt',staged:false,unstaged:true,status:'modified'};
Object.assign(demo,{repoId:'linked-fixture',revision:'initial',headOid:demo.commits[0].oid,writeBlock:'Linked worktree: Stage, Unstage and Commit available.',linkedLocalWrites:true,recoveryPending:false,changes:[change]});
let current=structuredClone(demo),calls=[],pending;
api.refresh=async()=>structuredClone(current);api.loadDraft=async()=>({draft:null,revision:'missing',warning:null});api.saveDraft=async(id,revision,draft)=>({draft,revision:'saved',warning:null});api.saveWorkspace=async()=>({workspace:null,revision:'saved',warning:null});api.mutate=(snapshot,action)=>{calls.push(action);return new Promise((resolve,reject)=>pending={resolve,reject})};
api.diff=async()=>({text:'diff --git a/linked.txt b/linked.txt\n--- a/linked.txt\n+++ b/linked.txt\n@@ -1 +1 @@\n-old\n+new\n',truncated:false,hunks:[{index:0,header:'@@ -1 +1 @@'}],selectableLines:[{hunk:0,line:0,oldLine:1,newLine:null},{hunk:0,line:1,oldLine:null,newLine:1}]});
createRoot(document.getElementById('root')).render(React.createElement(App));
const tick=()=>new Promise(r=>setTimeout(r,60)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent.trim()===t),field=l=>document.querySelector(`[aria-label="${l}"]`),set=(el,v)=>{Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(el,v);el.dispatchEvent(new Event('input',{bubbles:true}))};
const accept=async(values)=>{current={...current,...values,revision:current.revision+'x'};pending.resolve(structuredClone(current));await tick()};
document.getElementById('run').onclick=async()=>{const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)};try{
await tick();check(!button('Stage All Changes').disabled,'linked whole-file Stage available despite general write block');check(field('Discard all changes').disabled&&field('Stash changes').disabled,'unmigrated discard and stash remain disabled');check(document.querySelector('.amend input').disabled,'amend remains disabled');
button('Stage All Changes').click();await tick();check(calls.at(-1).kind==='stageAll'&&button('Stage All Changes').disabled,'Stage routes once and disables while pending');pending.reject('CANCELLED: synthetic native cancel');await tick();check(!button('Stage All Changes').disabled&&document.querySelector('.unstaged').textContent.includes('linked.txt'),'cancel preserves unstaged file and re-enables action');
button('Stage All Changes').click();await tick();await accept({changes:[{...change,staged:true,unstaged:false}]});check(document.querySelector('.staged').textContent.includes('linked.txt'),'Stage result moves file into staged list');button('Unstage All Changes').click();await tick();check(calls.at(-1).kind==='unstageAll','Unstage uses supported action');await accept({changes:[change]});
field('Select unstaged file linked.txt').click();await tick();button('Stage selected (1)...').click();await tick();button('Stage listed files').click();await tick();check(calls.at(-1).kind==='stageFiles'&&calls.at(-1).file_ids[0]===change.id,'selected-file review accepts linked capability and exact file');await accept({changes:[{...change,staged:true,unstaged:false}]});
set(field('커밋 메시지'),'Linked fixture commit');button('Commit options').click();await tick();set(field('작성자'),'Fixture');set(field('이메일'),'fixture@example.invalid');await tick();button('Commit changes').click();await tick();check(calls.at(-1).kind==='commit'&&calls.at(-1).message==='Linked fixture commit','Commit routes entered message and supported operation');pending.reject('CANCELLED: synthetic native cancel');await tick();check(field('커밋 메시지').value==='Linked fixture commit','cancel retains commit draft');button('Commit changes').click();await tick();await accept({changes:[]});check(button('Commit changes')?.disabled||button('Type a Message to Commit')?.disabled,'committed empty staging disables next commit');
current={...current,recoveryPending:true,linkedLocalWrites:false,changes:[change]};document.querySelector('[title="Refresh"]').click();await tick();check(!!button('Recover operation')&&button('Stage All Changes').disabled,'recovery snapshot exposes recovery and blocks Stage');button('Recover operation').click();await tick();check(calls.at(-1).kind==='recoverCheckout','Recover button uses native recovery operation');await accept({recoveryPending:false,linkedLocalWrites:true});check(!button('Recover operation')&&!button('Stage All Changes').disabled,'successful recovery clears banner and restores supported actions');
button('linked.txt').click();await tick();check(!!field('Stage hunk 1'),'linked diff exposes existing hunk action');field('Stage hunk 1').click();await tick();check(calls.at(-1).kind==='stageHunk'&&calls.at(-1).hunk===0&&!calls.at(-1).unstage,'hunk action routes exact selection');pending.reject('CANCELLED: hunk cancel');await tick();check(!!field('Stage hunk 1'),'hunk cancel retains diff');
field('Stage hunk 1').click();await tick();await accept({changes:[{...change,staged:true,unstaged:false}]});check(!!field('Unstage hunk 1'),'successful hunk updates diff to staged side');
const line=document.querySelector('[aria-label^="Select diff line"]');check(!!line,'linked diff exposes line selection');line.click();await tick();button('Unstage selected lines (1)').click();await tick();check(calls.at(-1).kind==='stageLines'&&calls.at(-1).unstage&&calls.at(-1).lines.length===1,'line unstage routes selection and direction');await accept({changes:[change]});check(!!field('Stage hunk 1'),'line result refreshes unstaged diff');
current={...current,linkedLocalWrites:false,writeBlock:'Repository policy blocks linked writes'};document.querySelector('[title="Refresh"]').click();await tick();check(button('Stage All Changes').disabled,'policy refusal disables local writes');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks,scope:'Actual App components and synthetic API; native Git separately tested'},null,2);
}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),passed:checks.length,checks},null,2)}};
</script></body></html>
