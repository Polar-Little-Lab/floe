<!doctype html><html><body><button id="run">Run WIP checks</button><pre id="result">Not run</pre><div id="root"></div><script type="module">
import React from'react';import{createRoot}from'react-dom/client';import{LaunchpadTasks}from'/src/LaunchpadTasks.tsx';import{api}from'/src/api.ts';
let record={workspace:{selected:'a',groups:[{id:'a',name:'Alpha',repositories:[{owner:'o',repo:'a',localPath:null}],views:[]}]},revision:'1',warning:null},reads=0,selected=null,fail=false,deferred=null,override=null;
api.loadNamedWorkspaces=async()=>structuredClone(record);api.saveNamedWorkspaces=async(revision,workspace)=>{if(revision!==record.revision)throw Error('STALE_WORKSPACE');record={workspace:structuredClone(workspace),revision:String(+record.revision+1),warning:null};return structuredClone(record)};api.openRepositoryPaths=async()=>[{repoId:'trusted',path:'/synthetic/a'}];
const entry=state=>({repository:'o/a',localPath:record.workspace.groups[0].repositories[0].localPath,state,repoId:state==='changes'?'trusted':null,branch:'feature',changed:2,staged:1,unstaged:2,warning:null});
api.readWorkspaceWips=async()=>{reads++;if(deferred)return new Promise(r=>deferred.resolve=r);if(fail)throw Error('read failed');return{workspaceId:'a',entries:override??[entry(record.workspace.groups[0].repositories[0].localPath?'changes':'unmapped')]}};
const root=createRoot(document.getElementById('root'));root.render(React.createElement(LaunchpadTasks,{onSelect:id=>selected=id}));const tick=()=>new Promise(r=>setTimeout(r,60)),button=t=>[...document.querySelectorAll('#root button')].find(b=>b.textContent===t),label=n=>document.querySelector(`[aria-label="${n}"]`),select=async(n,v)=>{const e=label(n);e.value=v;e.dispatchEvent(new Event('change',{bubbles:true}));await tick()},text=()=>label('Workspace WIPs').textContent;
document.getElementById('run').onclick=async()=>{let checks=[];const check=(ok,n)=>{if(!ok)throw Error(n);checks.push(n)};try{await tick();check(reads===0,'no automatic WIP reads');button('WIPs').click();await tick();button('Refresh WIPs').click();await tick();check(text().includes('Link a local repository'),'unmapped distinct from clean');button('Refresh open repositories').click();await tick();check(label('Local repository for o/a').options.length===2,'offers trusted open path');await select('Local repository for o/a','/synthetic/a');check(record.workspace.groups[0].repositories[0].localPath==='/synthetic/a','mapping persisted');check(text().includes('Not loaded.'),'mapping change invalidates previous results');button('Refresh WIPs').click();await tick();check(text().includes('2 changed · 1 staged · 2 unstaged'),'renders status counts');button('View Repo').click();check(selected==='trusted','View Repo selects existing session');fail=true;button('Refresh WIPs').click();await tick();check(text().includes('Previous results retained')&&text().includes('2 changed'),'read error retains visible stale results');fail=false;
record.revision='100';await select('Local repository for o/a','');check(record.workspace.groups[0].repositories[0].localPath==='/synthetic/a'&&document.body.textContent.includes('STALE_WORKSPACE'),'stale mapping write preserves saved path');button('Reload workspaces').click();await tick();await select('Local repository for o/a','');check(record.workspace.groups[0].repositories[0].localPath===null,'reload and unlink retry');
deferred={};button('Refresh WIPs').click();await tick();check(button('Refresh WIPs').disabled,'duplicate read disabled');await select('Local repository for o/a','/synthetic/a');deferred.resolve({workspaceId:'a',entries:[entry('unmapped')]});await tick();check(text().includes('Not loaded.')&&!text().includes('Link a local repository'),'late response discarded after mapping changes');deferred=null;
button('All').click();await tick();check(!!label('Workspace WIPs'),'All includes WIPs');
const input=async(n,v)=>{const e=label(n);Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));await tick()};
override=[entry('clean')];button('Refresh WIPs').click();await tick();check(text().includes('1 repositories checked clean.')&&!button('View Repo'),'clean status omitted from change rows');
override=[entry('notOpen')];button('Refresh WIPs').click();await tick();check(text().includes('Linked repository is not open.')&&!button('View Repo'),'closed repository cannot navigate');
override=[{...entry('error'),warning:'fixture read warning'}];button('Refresh WIPs').click();await tick();check(text().includes('Unable to read local changes.')&&text().includes('fixture read warning'),'read error status and warning visible');
override=[entry('changes')];button('Refresh WIPs').click();await tick();await input('Search workspace tasks','FEATURE synthetic');check(text().includes('2 changed'),'query matches branch and path together');await input('Search workspace tasks','absent');check(text().includes('No matching WIPs.'),'query excludes nonmatching changes');await input('Search workspace tasks','feature');button('WIPs').click();await tick();await input('Saved view name','Local feature');button('Save current view as new').click();await tick();const view=record.workspace.groups[0].views[0];check(view.kind==='wips'&&view.query==='feature','saved view persists WIP kind and query');
root.render(null);await tick();root.render(React.createElement(LaunchpadTasks,{onSelect:id=>selected=id}));await tick();const before=reads;await select('Saved workspace view',view.id);button('Apply saved view').click();await tick();check(button('WIPs').getAttribute('aria-pressed')==='true'&&label('Search workspace tasks').value==='feature'&&reads===before,'remount restores WIP view without fetching');
record.workspace.groups[0].views[0].filters.label='bug';button('Reload saved views').click();await tick();button('Apply saved view').click();await tick();check(text().includes('Clear these filters'),'provider-only filters explain excluded WIPs');
document.getElementById('result').textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(e){document.getElementById('result').textContent=JSON.stringify({failed:String(e),checks},null,2)}};
</script></body></html>
