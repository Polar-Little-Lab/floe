name: Check desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup show
      - run: npm ci
      - run: npm run check
      - name: Test synthetic repositories with isolated Git defaults
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/floe-test.gitconfig
        run: |
          # Fixtures choose their own per-repository policy. Runner-global
          # autocrlf must not rewrite their byte-exact LF inputs on Windows.
          : > "$GIT_CONFIG_GLOBAL"
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm audit --audit-level=high
      - run: npm run tauri build -- --no-bundle
